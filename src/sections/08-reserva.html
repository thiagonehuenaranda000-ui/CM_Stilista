<!-- 08. WIDGET DE RESERVA / CONSULTA A WHATSAPP -->
<section class="py-space-xl bg-surface-container-low border-y border-outline-variant/30" id="reservar-ahora">
  <div class="max-w-4xl mx-auto px-margin-mobile lg:px-margin">
    <div class="text-center mb-space-md">
      <span class="font-label-md text-xs text-primary uppercase tracking-widest block mb-1 font-semibold">Agendá tu Cita</span>
      <h2 class="font-headline-lg text-3xl sm:text-4xl text-on-surface mb-2">Consultá disponibilidad en segundos</h2>
      <p class="font-body-md text-on-surface-variant">Elegí el tratamiento que te querés hacer y charlemos directo por WhatsApp para coordinar tu día y horario.</p>
    </div>
    <div class="p-space-lg rounded-3xl bg-surface-container border border-outline-variant/40 shadow-2xl flex flex-col gap-space-md">
      <!-- Paso 1: Servicio -->
      <div>
        <label class="block font-label-md text-sm text-on-surface mb-2 flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center font-label-md text-xs font-bold">1</span>Elegí el tratamiento que te interesa
        </label>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5" id="service-selector" role="radiogroup" aria-label="Seleccioná el servicio">
          <button class="service-pill p-3 rounded-xl bg-primary text-white font-label-md text-xs transition-all text-left flex flex-col justify-between active-service ring-1 ring-primary" data-srv="Alisado Biomolecular" type="button" aria-checked="true" tabindex="0">
            <span class="font-semibold">Alisado Biomolecular</span>
            <span class="text-white/80 text-[11px] mt-1">Lacio espejo</span>
          </button>
          <button class="service-pill p-3 rounded-xl bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-md text-xs transition-all text-left flex flex-col justify-between" data-srv="Balayage &amp; Mechas" type="button" aria-checked="false" tabindex="-1">
            <span class="font-semibold">Balayage &amp; Mechas</span>
            <span class="text-primary text-[11px] mt-1">Rubios &amp; Miel</span>
          </button>
          <button class="service-pill p-3 rounded-xl bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-md text-xs transition-all text-left flex flex-col justify-between" data-srv="Botox &amp; Nutrición" type="button" aria-checked="false" tabindex="-1">
            <span class="font-semibold">Botox &amp; Nutrición</span>
            <span class="text-primary text-[11px] mt-1">Antifrizz profundo</span>
          </button>
          <button class="service-pill p-3 rounded-xl bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-md text-xs transition-all text-left flex flex-col justify-between" data-srv="Trenzas &amp; Peinados" type="button" aria-checked="false" tabindex="-1">
            <span class="font-semibold">Trenzas &amp; Peinados</span>
            <span class="text-primary text-[11px] mt-1">Diseño de autor</span>
          </button>
        </div>
      </div>
      <!-- Paso 2: Días sugeridos -->
      <div>
        <label class="block font-label-md text-sm text-on-surface mb-2 flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center font-label-md text-xs font-bold">2</span>Elegí el día que te queda mejor
        </label>
        <div class="grid grid-cols-5 gap-2" id="date-selector" role="radiogroup" aria-label="Seleccioná el día">
          <button class="date-pill p-3 rounded-xl bg-surface-container-high hover:bg-surface-container-highest text-center transition-all" data-day="Martes" type="button" aria-checked="false" tabindex="-1">
            <span class="block font-label-md text-[11px] text-on-surface-variant">Día</span>
            <span class="font-headline-sm text-base text-on-surface font-semibold">Mar</span>
          </button>
          <button class="date-pill p-3 rounded-xl bg-primary text-white text-center transition-all shadow-sm active-date ring-1 ring-primary" data-day="Miércoles" type="button" aria-checked="true" tabindex="0">
            <span class="block font-label-md text-[11px] text-white/80">Día</span>
            <span class="font-headline-sm text-base font-semibold">Mié</span>
          </button>
          <button class="date-pill p-3 rounded-xl bg-surface-container-high hover:bg-surface-container-highest text-center transition-all" data-day="Jueves" type="button" aria-checked="false" tabindex="-1">
            <span class="block font-label-md text-[11px] text-on-surface-variant">Día</span>
            <span class="font-headline-sm text-base text-on-surface font-semibold">Jue</span>
          </button>
          <button class="date-pill p-3 rounded-xl bg-surface-container-high hover:bg-surface-container-highest text-center transition-all" data-day="Viernes" type="button" aria-checked="false" tabindex="-1">
            <span class="block font-label-md text-[11px] text-on-surface-variant">Día</span>
            <span class="font-headline-sm text-base text-on-surface font-semibold">Vie</span>
          </button>
          <button class="date-pill p-3 rounded-xl bg-surface-container-high hover:bg-surface-container-highest text-center transition-all" data-day="Sábado" type="button" aria-checked="false" tabindex="-1">
            <span class="block font-label-md text-[11px] text-on-surface-variant">Día</span>
            <span class="font-headline-sm text-base text-on-surface font-semibold">Sáb</span>
          </button>
        </div>
      </div>
      <!-- Paso 3: Franja horaria -->
      <div>
        <label class="block font-label-md text-sm text-on-surface mb-2 flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center font-label-md text-xs font-bold">3</span>
          Franja Horaria de Preferencia
        </label>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5" id="time-selector" role="radiogroup" aria-label="Seleccioná el horario">
          <button class="time-pill py-3 px-4 rounded-xl bg-primary text-white font-label-md text-xs text-center transition-all active-time ring-1 ring-primary" type="button" aria-checked="true" tabindex="0">
            10:00 hs (Mañana)
          </button>
          <button class="time-pill py-3 px-4 rounded-xl bg-surface-container-high hover:bg-surface-container-highest font-label-md text-xs text-on-surface text-center transition-all" type="button" aria-checked="false" tabindex="-1">
            13:00 hs (Mediodía)
          </button>
          <button class="time-pill py-3 px-4 rounded-xl bg-surface-container-high hover:bg-surface-container-highest font-label-md text-xs text-on-surface text-center transition-all" type="button" aria-checked="false" tabindex="-1">
            15:30 hs (Tarde)
          </button>
          <button class="time-pill py-3 px-4 rounded-xl bg-surface-container-high hover:bg-surface-container-highest font-label-md text-xs text-on-surface text-center transition-all" type="button" aria-checked="false" tabindex="-1">
            18:00 hs (Tarde-noche)
          </button>
        </div>
      </div>
      <!-- Datos de contacto -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
        <input class="w-full h-12 px-4 rounded-xl bg-surface-container-high text-on-surface font-body-md text-sm border border-outline-variant/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-on-surface-variant/50" id="client-name" placeholder="Tu nombre" type="text" aria-label="Tu nombre">
        <input class="w-full h-12 px-4 rounded-xl bg-surface-container-high text-on-surface font-body-md text-sm border border-outline-variant/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-on-surface-variant/50" id="client-msg" placeholder="Comentario o consulta sobre tu cabello" type="text" aria-label="Comentario o consulta sobre tu cabello">
      </div>
      <!-- CTA y envío -->
      <div class="pt-2 flex flex-col gap-3">
        <button class="w-full min-h-[52px] rounded-full bg-primary text-white hover:bg-primary-hover font-label-md text-xs uppercase tracking-wider font-semibold transition-all duration-300 shadow-[0_4px_25px_rgba(240,45,125,0.4)] flex items-center justify-center gap-2" id="btn-confirm-booking" type="button">
          <span class="">Consultá tu turno con Cintia por WhatsApp</span><span class="material-symbols-outlined text-[20px]">chat</span>
        </button>
        <div class="flex items-center justify-center gap-2 text-center">
          <span class="material-symbols-outlined text-primary text-[18px]">verified</span>
          <p class="font-body-md text-xs text-on-surface-variant">
            Respuesta personalizada directa por WhatsApp (+54 9 11 5868-2890) · Atención exclusiva.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
